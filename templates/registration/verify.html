{% extends 'base/base.html' %}

{% block content %}
<h2>تأیید شماره موبایل</h2>
<p>کد تأیید به شماره {{ phone_number }} ارسال شد</p>

<form method="post">
  {% csrf_token %}
  
  <div class="form-group">
    {{ form.verification_code.label_tag }}
    {{ form.verification_code }}
    {{ form.verification_code.errors }}
  </div>
  
  <div class="form-group">
    {{ form.captcha }}
  </div>
  
  <button type="submit" class="btn btn-primary">تأیید و ورود به سیستم</button>
</form>
{% endblock %}
