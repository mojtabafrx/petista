{% extends 'user_panel/dashboard.html' %}
{% load static %}
{% block custom_css %}
	<link rel="stylesheet" href="{% static '/css/userpanel/change-password.css' %}"/>{% endblock %}
<style>
    input:-moz-autofill,
    input:-moz-autofill:hover,
    input:-moz-autofill:focus,
    input:-moz-autofill:active {
        background-color: rgb(57, 57, 54) !important;
        box-shadow: 0 0 0 1000px rgb(62, 62, 52) inset !important;
        -webkit-text-fill-color: #000 !important;
        color: #000 !important;
        border-color: #ffcc00;
    }
</style>
{% block content %}

	<!-- Font Awesome -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

	<div class="all-div-container">
		<div class="container-change-password container">
			<div class="head-container-change-password head-container">
				<img class="head-container-icon" src="{% static 'images/icons8-password-48.png' %}">
				<span class="head-container-name">تغییر رمز عبور</span>
			</div>
			<div class="password-change-form">
				<form action="{% url 'user_panel:change_password' %}" id="change-password-form" method="post">
					{% csrf_token %}

					<div class="form-group password-wrapper">
						<label for="current-password">رمز عبور فعلی</label>
						<div class="input-container">
							<input name="old_password" type="password" id="current-password"
							       placeholder="رمز فعلی خود را وارد کنید" autocomplete="off" value="">
							<i class="fa-solid fa-eye toggle-password"
							   onclick="togglePassword('current-password', this)"></i>
						</div>
					</div>

					<div class="form-group password-wrapper">
						<label for="new-password">رمز عبور جدید</label>
						<div class="input-container">
							<input name="new_password1" type="password" id="new-password"
							       placeholder="رمز عبور جدید را وارد کنید">
							<i class="fa-solid fa-eye toggle-password"
							   onclick="togglePassword('new-password', this)"></i>
						</div>
					</div>

					<div class="form-group password-wrapper">
						<label for="confirm-password">تکرار رمز عبور جدید</label>
						<div class="input-container">
							<input name="new_password2" type="password" id="confirm-password"
							       placeholder="تکرار رمز عبور جدید">
							<i class="fa-solid fa-eye toggle-password"
							   onclick="togglePassword('confirm-password', this)"></i>
						</div>
					</div>

					<div class="submit-container">
						<button class="submit-btn" type="submit">
							<img src="{% static 'images/icons8-save-50.png' %}" width="25px" height="25px">
							ذخیره تغییرات
						</button>
					</div>
				</form>
			</div>
		</div>
	</div>

	<script>


        function togglePassword(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }
	</script>


{% endblock %}

{% block custom_js %}
	<script>
        $(document).ready(function () {
            $("#current-password").val("")

        })
	</script>

{% endblock %}
