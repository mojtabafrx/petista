{% extends 'user_panel/dashboard.html' %}
{% load static %}
{% block custom_css %}<link rel="stylesheet" href="{% static '/css/userpanel/add-seller-product.css' %}"/>{% endblock %}
{% block content %}
<div class="container">
    <div class="all-header-container"></div>

    <div class="head-container">
        <img class="head-container-icon" src="{% static 'images/icons8-add-to-cart-30.png' %}">
        <span class="head-container-name">افزودن محصول جدید</span>
    </div>
    <div class="main-container">
        <div class="form-container">
            <form id="productForm" method="post" action="{% url 'user_panel:add_seller_product' %}">
            {% csrf_token %}
                <div class="all-div-select">
                    <div class="div-category select">
                        <label for="categorySelect" class="category-label label">دسته‌بندی را انتخاب
                            کنید</label>
                        <select id="category-select" required>
                            <option value="" selected disabled>دسته‌بندی را انتخاب کنید</option>
                            {% for category in categories %}
                            <option value="{{ category.id }}">{{ category.title }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="div-product-select select">
                        <label for="productSelect" class="product-label label">محصول را انتخاب کنید</label>
                        <select name="product" id="product-select" disabled required>
                            <option value="" selected disabled>ابتدا دسته‌بندی را انتخاب کنید</option>
                        </select>
                    </div>
                </div>

                <div class="all-div-inputs">

                    <div class="count-input-div input-div">
                        <label for="quantityInput">تعداد</label>
                        <input name="stock" class="count-input main-input" type="number" id="quantityInput" min="1"
                               placeholder="تعداد را وارد کنید" required/>

                    </div>
                    <div class="price-input-div input-div">
                        <label for="priceInput">قیمت (تومان)</label>
                        <input class="price-input main-input" name="price" type="number" id="priceInput" min="0"
                               placeholder="قیمت را وارد کنید" required/>

                    </div>

                </div>
                <button type="submit">ثبت محصول</button>
            </form>
        </div>

    </div>
</div>
{% endblock %}

{% block custom_js %}
<script>
// تغییر دسته‌بندی (AJAX)
$('#category-select').change(function() {
    const categoryId = $(this).val();
    $('#product-select').prop('disabled', true).html('<option>در حال بارگذاری...</option>');

    if (!categoryId) {
        $('#product-select').html('<option>ابتدا دسته‌بندی را انتخاب کنید</option>');
        return;
    }

    // درخواست AJAX برای دریافت محصولات
    $.get('{% url "user_panel:get_products" %}', {category_id: categoryId}, function(products) {
        let options = '<option value="">انتخاب محصول</option>';

        if (products.length > 0) {
            products.forEach(product => {
                options += `<option value="${product.id}">${product.title}</option>`;
            });
        } else {
            options = '<option value="">محصولی یافت نشد</option>';
        }

        $('#product-select').html(options).prop('disabled', false);
    }).fail(function() {
        $('#product-select').html('<option>خطا در دریافت اطلاعات</option>');
        showMessage('خطا در دریافت محصولات. لطفاً دوباره تلاش کنید', false);
    });
});


</script>
{% endblock %}
